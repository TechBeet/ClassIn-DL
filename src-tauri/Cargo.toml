[package]
name = "classin-dl"
version = "1.0.0"
description = "ClassIn视频解析下载工具"
authors = [""]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "classin_dl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "classin-dl"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "stream"] }
tokio = { version = "1", features = ["full"] }
arboard = "3"
walkdir = "2"
percent-encoding = "2"
regex = "1"
tokio-stream = "0.1"
rfd = "0.14"
open = "5"
dirs = "5"
