name: Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        type: string

env:
  APP_NAME: classin-dl
  RUST_VERSION: '1.88.0'

jobs:
  ci:
    name: CI (Build Verification)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
      - name: Check syntax
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

  build-windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package Windows x64
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/${{ env.APP_NAME }}.exe" "release/"
          Compress-Archive -Path "release/*" -DestinationPath "release/${{ env.APP_NAME }}-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-windows-x64
          path: release/${{ env.APP_NAME }}-windows-x64.zip

  build-windows-arm64:
    name: Windows (ARM64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package Windows ARM64
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "src-tauri/target/aarch64-pc-windows-msvc/release/${{ env.APP_NAME }}.exe" "release/"
          Compress-Archive -Path "release/*" -DestinationPath "release/${{ env.APP_NAME }}-windows-arm64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-windows-arm64
          path: release/${{ env.APP_NAME }}-windows-arm64.zip

  build-macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin
      - name: Build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package macOS ARM64
        run: |
          mkdir -p release
          cp "src-tauri/target/aarch64-apple-darwin/release/${{ env.APP_NAME }}" "release/"
          cd release && tar -czf "${{ env.APP_NAME }}-macos-arm64.tar.gz" "${{ env.APP_NAME }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-macos-arm64
          path: release/${{ env.APP_NAME }}-macos-arm64.tar.gz

  build-macos-x64:
    name: macOS (Intel)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin
      - name: Build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package macOS x64
        run: |
          mkdir -p release
          cp "src-tauri/target/x86_64-apple-darwin/release/${{ env.APP_NAME }}" "release/"
          cd release && tar -czf "${{ env.APP_NAME }}-macos-x64.tar.gz" "${{ env.APP_NAME }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-macos-x64
          path: release/${{ env.APP_NAME }}-macos-x64.tar.gz

  build-linux-x64-gnu:
    name: Linux (x64 glibc)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
      - name: Build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package Linux x64 glibc
        run: |
          mkdir -p release
          cp "src-tauri/target/x86_64-unknown-linux-gnu/release/${{ env.APP_NAME }}" "release/"
          chmod +x "release/${{ env.APP_NAME }}"
          cd release && tar -czf "${{ env.APP_NAME }}-linux-x64.tar.gz" "${{ env.APP_NAME }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-linux-x64
          path: release/${{ env.APP_NAME }}-linux-x64.tar.gz

  build-linux-arm64-gnu:
    name: Linux (ARM64)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-unknown-linux-gnu
      - name: Build release
        env:
          RUSTFLAGS: -C link-arg=-lgcc
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package Linux ARM64
        run: |
          mkdir -p release
          cp "src-tauri/target/aarch64-unknown-linux-gnu/release/${{ env.APP_NAME }}" "release/"
          chmod +x "release/${{ env.APP_NAME }}"
          cd release && tar -czf "${{ env.APP_NAME }}-linux-arm64.tar.gz" "${{ env.APP_NAME }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-linux-arm64
          path: release/${{ env.APP_NAME }}-linux-arm64.tar.gz

  build-linux-x64-musl:
    name: Linux (x64 static musl)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        run: sudo apt-get install -y musl-tools
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-musl
      - name: Build release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package Linux x64 musl
        run: |
          mkdir -p release
          cp "src-tauri/target/x86_64-unknown-linux-musl/release/${{ env.APP_NAME }}" "release/"
          chmod +x "release/${{ env.APP_NAME }}"
          cd release && tar -czf "${{ env.APP_NAME }}-linux-x64-musl.tar.gz" "${{ env.APP_NAME }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-linux-x64-musl
          path: release/${{ env.APP_NAME }}-linux-x64-musl.tar.gz

  create-release:
    name: Create Release
    needs: [build-windows-x64, build-windows-arm64, build-macos-arm64, build-macos-x64, build-linux-x64-gnu, build-linux-arm64-gnu, build-linux-x64-musl]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: releases/**/*.zip releases/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
