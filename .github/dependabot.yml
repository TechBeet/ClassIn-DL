version: 2
updates:
  # 检测 Rust 依赖更新
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "maintainer"
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # 忽略主要版本的大变更
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 检测 GitHub Actions 更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    reviewers:
      - "maintainer"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"

  # 检测 pip 依赖更新（如有 Python 脚本）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "pip"

  # 检测 Docker 依赖更新
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"